<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3a6b" />
    <meta name="description" content="Samadhan (Citizen Grievance Dashboard)" />
    <title>Samadhan (Citizen Grievance Dashboard)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
      #root { min-height: 100vh; }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'hi,mr,ta,te,kn,ml,pa,gu,bn,en', // Major Indian Languages + English
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use the Samadhan (Citizen Grievance Dashboard).</noscript>
    <div id="root"></div>
  </body>
</html>
