name: Samadhan CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install
      
    - name: Run Backend Tests
      working-directory: ./backend
      run: |
        sleep 5
        npm test
      env:
        MONGO_URI: mongodb://127.0.0.1:27017/samadhan_test
        REDIS_URI: redis://127.0.0.1:6379
        JWT_SECRET: test_secret_key
        NODE_ENV: test
